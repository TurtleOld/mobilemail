name: Auto-update PR branches

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update open PR branches from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          for pr in $(gh pr list -R "$REPO" --base main --state open --json number,isCrossRepository --jq '.[] | select(.isCrossRepository == false) | .number'); do
            echo "Updating PR #$pr from main"
            if gh pr update-branch -R "$REPO" "$pr"; then
              branch=$(gh pr view -R "$REPO" "$pr" --json headRefName --jq '.headRefName')
              gh workflow run android-ci.yml -R "$REPO" --ref "$branch"
            else
              echo "PR #$pr could not be updated; skipping CI dispatch"
            fi
          done

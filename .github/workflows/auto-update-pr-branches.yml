name: Auto-update PR branches

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-branches:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Update open PR branches from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 2))"; fi
            done
            return 1
          }

          prs=$(retry gh pr list -R "$REPO" --base main --state open --limit 1000 \
            --json number,headRefName,isCrossRepository,mergeable \
            --jq '.[] | select(.isCrossRepository == false) | [.number, .headRefName, .mergeable] | @tsv')
          failed=0
          while IFS=$'\t' read -r pr branch mergeable; do
            [ -n "$pr" ] || continue
            if [ "$mergeable" = CONFLICTING ]; then
              echo "::warning::PR #$pr has conflicts; resolve them before CI can allow merging"
              echo "- PR #$pr: conflicts" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if ! retry gh pr update-branch -R "$REPO" "$pr"; then
              echo "::error::Could not update PR #$pr"
              echo "- PR #$pr: update failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            if ! retry gh workflow run android-ci.yml -R "$REPO" --ref "$branch"; then
              echo "::error::Could not dispatch Android CI for PR #$pr"
              echo "- PR #$pr: CI dispatch failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            echo "- PR #$pr: Android CI requested" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$prs"
          exit "$failed"
